<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img"><title>Indexer and keeper service loop</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#4D829E"/></marker></defs><rect width="1200" height="550" fill="#FCFEFF"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F3B4E"><text x="32" y="60" font-size="30" font-weight="700">Indexer and keeper service loop</text><rect x="32" y="145" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="197" y="187" text-anchor="middle" font-size="19" font-weight="700">Chain events</text><text x="197" y="219" text-anchor="middle" font-size="14">Logs + block hashes</text><rect x="412" y="145" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="577" y="187" text-anchor="middle" font-size="19" font-weight="700">Indexer</text><text x="577" y="219" text-anchor="middle" font-size="14">Canonical replay + reorg rollback</text><rect x="792" y="145" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="957" y="187" text-anchor="middle" font-size="19" font-weight="700">Database</text><text x="957" y="219" text-anchor="middle" font-size="14">Durable checkpoint + read model</text><rect x="32" y="315" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="197" y="357" text-anchor="middle" font-size="19" font-weight="700">Task planner</text><text x="197" y="389" text-anchor="middle" font-size="14">Conditional + liquidation candidates</text><rect x="412" y="315" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="577" y="357" text-anchor="middle" font-size="19" font-weight="700">Keeper</text><text x="577" y="389" text-anchor="middle" font-size="14">Live reads + simulation</text><rect x="792" y="315" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="957" y="357" text-anchor="middle" font-size="19" font-weight="700">EVM contracts</text><text x="957" y="389" text-anchor="middle" font-size="14">Signed transactions + emitted events</text></g><path d="M362 199 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M742 199 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M362 369 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M742 369 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M957 253 V281 H197 V315" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1122 369 H1155 V115 H197 V145" stroke="#4D829E" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/><text x="34" y="525" font-family="Arial" font-size="15" fill="#425E72">The keeper requires current on-chain state; indexed tasks are not execution authorization.</text></svg>
