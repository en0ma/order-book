<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">DEX integration architecture</title><desc id="desc">Team hosted frontend and backend connect to SDK, indexer, keeper and signer services. Contracts control the order book and collateral on-chain.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#3C6D84"/></marker></defs>
<rect width="1200" height="680" rx="18" fill="#F8FBFD"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#143449"><text x="30" y="44" font-size="27" font-weight="700">DEX integration: what the team operates</text><text x="30" y="73" font-size="15">Solid arrows show the main request or event path. Core keeps the authoritative account and order state.</text></g>
<rect x="26" y="104" width="355" height="492" rx="14" fill="#E5F3FA" stroke="#82B5CC" stroke-width="2"/>
<rect x="415" y="104" width="365" height="492" rx="14" fill="#EDF3EE" stroke="#9FBDA7" stroke-width="2"/>
<rect x="815" y="104" width="359" height="492" rx="14" fill="#F4EEF9" stroke="#B8A1CE" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#17354A" font-size="18" font-weight="700"><text x="45" y="136">TEAM-HOSTED SERVICES</text><text x="435" y="136">REPOSITORY LIBRARIES</text><text x="835" y="136">ON-CHAIN CONTRACTS</text></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#17354A">
<rect x="65" y="167" width="274" height="55" rx="9" fill="white" stroke="#82B5CC"/><text x="202" y="201">Frontend + trading API</text>
<rect x="65" y="253" width="274" height="55" rx="9" fill="white" stroke="#82B5CC"/><text x="202" y="287">RPC + signer service</text>
<rect x="65" y="339" width="274" height="55" rx="9" fill="white" stroke="#82B5CC"/><text x="202" y="373">Index database</text>
<rect x="65" y="425" width="274" height="55" rx="9" fill="white" stroke="#82B5CC"/><text x="202" y="459">Keeper + liquidator</text>
<rect x="65" y="511" width="274" height="55" rx="9" fill="white" stroke="#82B5CC"/><text x="202" y="545">Market-maker strategy</text>
<rect x="454" y="167" width="287" height="76" rx="9" fill="white" stroke="#9FBDA7"/><text x="597" y="200">SDK</text><text x="597" y="224" font-size="14">Transaction plans and attestation</text>
<rect x="454" y="306" width="287" height="76" rx="9" fill="white" stroke="#9FBDA7"/><text x="597" y="339">Reference indexer</text><text x="597" y="362" font-size="14">Replay and rollback</text>
<rect x="454" y="445" width="287" height="76" rx="9" fill="white" stroke="#9FBDA7"/><text x="597" y="478">Operator library</text><text x="597" y="502" font-size="14">Keeper task planning</text>
<rect x="848" y="167" width="289" height="78" rx="9" fill="white" stroke="#B8A1CE"/><text x="992" y="201">OrderBookCore</text><text x="992" y="226" font-size="14">Matching, margin, custody</text>
<rect x="848" y="293" width="289" height="78" rx="9" fill="white" stroke="#B8A1CE"/><text x="992" y="328">Advanced + strategy modules</text><text x="992" y="352" font-size="14">Triggers, quotes, order controls</text>
<rect x="848" y="419" width="289" height="78" rx="9" fill="white" stroke="#B8A1CE"/><text x="992" y="454">Liquidation + portfolio</text><text x="992" y="478" font-size="14">Optional shared vault and risk</text>
</g>
