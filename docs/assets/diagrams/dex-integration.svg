<path d="M339 195H454"/><path d="M741 205H848"/><path d="M339 280H400V265H790V206H848"/><path d="M848 333H790V335H741"/><path d="M454 344H339"/><path d="M339 452H454"/><path d="M741 483H818V459H848"/><path d="M339 539H400V220H454"/>
