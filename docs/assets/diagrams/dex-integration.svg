<g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#345266"><text x="30" y="632">Read contract state before privileged actions. Simulate keeper transactions. Reconcile indexed state after a chain reorganization.</text><text x="30" y="655">The SDK and operator library do not provide hosted infrastructure.</text></g>
