<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img"><title>Governance and funding authority</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#4D829E"/></marker></defs><rect width="1200" height="550" fill="#FCFEFF"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F3B4E"><text x="32" y="60" font-size="30" font-weight="700">Governance and funding authority</text><rect x="32" y="145" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="197" y="187" text-anchor="middle" font-size="19" font-weight="700">Governance Safe</text><text x="197" y="219" text-anchor="middle" font-size="14">Core owner authority</text><rect x="412" y="145" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="577" y="187" text-anchor="middle" font-size="19" font-weight="700">Updater selection</text><text x="577" y="219" text-anchor="middle" font-size="14">setFundingUpdater</text><rect x="792" y="145" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="957" y="187" text-anchor="middle" font-size="19" font-weight="700">Bounded wrapper</text><text x="957" y="219" text-anchor="middle" font-size="14">Operator + cadence + step bound</text><rect x="32" y="315" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="197" y="357" text-anchor="middle" font-size="19" font-weight="700">Core index</text><text x="197" y="389" text-anchor="middle" font-size="14">setFundingIndex</text><rect x="412" y="315" width="330" height="108" rx="13" fill="#EBF3FC" stroke="#4D829E" stroke-width="2"/><text x="577" y="357" text-anchor="middle" font-size="19" font-weight="700">Risk-off action</text><text x="577" y="389" text-anchor="middle" font-size="14">Pause new risk</text><rect x="792" y="315" width="330" height="108" rx="13" fill="#EDF4F6" stroke="#4D829E" stroke-width="2"/><text x="957" y="357" text-anchor="middle" font-size="19" font-weight="700">Monitoring</text><text x="957" y="389" text-anchor="middle" font-size="14">Check authority and index events</text></g><path d="M362 199 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M742 199 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M362 369 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M742 369 h50" stroke="#4D829E" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="34" y="525" font-family="Arial" font-size="15" fill="#425E72">A Core owner can rotate funding authority; wrapper bounds do not constrain governance.</text></svg>
