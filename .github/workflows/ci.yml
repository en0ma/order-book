name: ci

on:
  pull_request:

permissions:
  contents: read

# Cancel work for a superseded commit on the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: SDK, indexer and operator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SDK tests
        working-directory: sdk
        run: npm test
      - name: Reference indexer tests
        working-directory: reference/indexer
        run: npm test
      - name: Operator tests
        working-directory: operator
        run: npm test

  protocol:
    name: Formatting, unit, fuzz and gas ceilings
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore Foundry build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-protocol-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/**', 'src/**', 'test/**') }}
          restore-keys: foundry-protocol-${{ runner.os }}-
      - name: Format sources
        run: forge fmt
      - name: Unit, fuzz, and gas ceiling tests
        run: forge test --no-match-contract MainnetForkTest -vvv

  fork:
    name: Ethereum mainnet fork
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ETH_RPC: ${{ secrets.ETH_RPC }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Ethereum mainnet fork test
        run: |
          test -n "$ETH_RPC" || (echo "ETH_RPC secret is not configured" && exit 1)
          CLEAN_RPC="$(printf '%s' "$ETH_RPC" | xargs)"
          if ETH_RPC="$CLEAN_RPC" forge test --match-contract MainnetForkTest -vvv; then
            exit 0
          fi
          echo "::warning::Configured ETH_RPC could not create a Foundry fork; retrying public mainnet fallback"
          ETH_RPC="https://ethereum-rpc.publicnode.com" forge test --match-contract MainnetForkTest -vvv

  sizes-default:
    name: Default-profile contract sizes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore default-profile build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-size-default-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/**', 'src/**', 'test/**') }}
          restore-keys: foundry-size-default-${{ runner.os }}-
      - name: Default-profile contract sizes
        run: |
          set -o pipefail
          set +e
          forge build --sizes 2>&1 | tee contract-sizes.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && ! grep -Fq "Error: some contracts exceed the runtime size limit (EIP-170: 24576 bytes)" contract-sizes.txt; then
            exit "$status"
          fi
      - name: Upload default-profile size report
        uses: actions/upload-artifact@v4
        with:
          name: contract-sizes-default
          path: contract-sizes.txt
          if-no-files-found: error

  sizes:
    name: Size profile and deployable EIP-170
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore size-profile build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-size-deployable-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/**', 'src/**', 'test/**') }}
          restore-keys: foundry-size-deployable-${{ runner.os }}-
      - name: Size-profile contract sizes
        run: |
          set -o pipefail
          set +e
          FOUNDRY_PROFILE=size forge build --sizes 2>&1 | tee contract-sizes-size-profile.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && ! grep -Fq "Error: some contracts exceed the runtime size limit (EIP-170: 24576 bytes)" contract-sizes-size-profile.txt; then
            exit "$status"
          fi
      - name: Enforce deployable EIP-170 sizes
        run: |
          FOUNDRY_PROFILE=size forge build
          python3 script/check_deployable_sizes.py
      - name: Upload size-profile report
        uses: actions/upload-artifact@v4
        with:
          name: contract-sizes-size-profile
          path: contract-sizes-size-profile.txt
          if-no-files-found: error

  gas-report:
    name: Gas report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore gas-report build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-gas-report-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/**', 'src/**', 'test/**') }}
          restore-keys: foundry-gas-report-${{ runner.os }}-
      - name: Gas report
        run: |
          set -o pipefail
          forge test --no-match-contract MainnetForkTest --gas-report | tee gas-report.txt
      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: gas-report.txt
          if-no-files-found: error

  gas:
    name: Gas snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore gas-snapshot build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-gas-snapshot-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/**', 'src/**', 'test/**') }}
          restore-keys: foundry-gas-snapshot-${{ runner.os }}-
      - name: Gas snapshot
        run: forge snapshot --no-match-contract MainnetForkTest
      - name: Upload gas snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: .gas-snapshot
          if-no-files-found: error

  test:
    name: test
    if: always()
    needs: [node, protocol, fork, sizes-default, sizes, gas-report, gas]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          NODE_RESULT: ${{ needs.node.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          FORK_RESULT: ${{ needs.fork.result }}
          DEFAULT_SIZES_RESULT: ${{ needs['sizes-default'].result }}
          SIZES_RESULT: ${{ needs.sizes.result }}
          GAS_REPORT_RESULT: ${{ needs['gas-report'].result }}
          GAS_RESULT: ${{ needs.gas.result }}
        run: |
          for result in "$NODE_RESULT" "$PROTOCOL_RESULT" "$FORK_RESULT" "$DEFAULT_SIZES_RESULT" "$SIZES_RESULT" "$GAS_REPORT_RESULT" "$GAS_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required CI validation did not succeed: $result"
              exit 1
            fi
          done
